# Proves both packages build from the current source WITHOUT publishing anything (no tag, no release, no version bump).
# Approx.exe here is unsigned; the APK is signed with a throwaway CI key and is NOT uploaded (it could never update
# an official install). Official, update-capable files come only from "Release Approx".
name: Build check
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'android/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build Approx.exe (unsigned test build)
        working-directory: desktop
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          set -e
          npm install --no-audit --no-fund
          npm test
          npx electron-builder --win nsis --x64 --publish never
          test -f dist/Approx.exe
          sha256sum dist/Approx.exe | tee dist/Approx.exe.sha256
      - name: Inspect Approx.exe
        shell: pwsh
        run: |
          $v = (Get-Item desktop/dist/Approx.exe).VersionInfo
          Write-Host "ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileVersion=$($v.FileVersion) Size=$((Get-Item desktop/dist/Approx.exe).Length)"
          Write-Host "Authenticode: $((Get-AuthenticodeSignature desktop/dist/Approx.exe).Status)"
      - uses: actions/upload-artifact@v4
        with: { name: Approx-exe-test-build-unsigned, path: "desktop/dist/Approx.exe\ndesktop/dist/Approx.exe.sha256", retention-days: 14 }
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Compile and package (throwaway key, not uploaded)
        working-directory: android
        run: |
          set -e
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;34.0.0" >/dev/null
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"; export PATH="$BT:$PATH"
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-33/android.jar" APPROX_SERVER_URL=https://approx-ai.vercel.app bash build.sh
          "$BT/aapt" dump badging build/ApproxAI-Online-debug.apk | head -1
