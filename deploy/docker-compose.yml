# Production-style stack: Approx backend + vLLM serving Qwen2.5-3B-Instruct with the Nick 4.8 adapter.
# Requires an NVIDIA GPU host for the inference service, a TLS-terminating reverse proxy in front
# of `approx` (HTTPS is mandatory for the Android app), and a mail provider for verification emails.
services:
  approx:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]          # expose only via the TLS reverse proxy
    volumes: ["approx-data:/data"]
    env_file: [approx.env]                  # copy approx.env.example → approx.env (never commit)
    depends_on: [inference]
  inference:
    image: vllm/vllm-openai:v0.6.4
    restart: unless-stopped
    command: ["--model", "Qwen/Qwen2.5-3B-Instruct", "--enable-lora", "--lora-modules", "nick-4.8=/adapters/nick-4.8", "--max-model-len", "8192"]
    volumes: ["./adapters:/adapters:ro", "hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
volumes:
  approx-data: {}
  hf-cache: {}
