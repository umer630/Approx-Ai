# Hike 6.5 — advanced reasoning / tutoring tier. Pipeline prepared; NOT trained.
# Base model choice is a proposal by the engineering team (Approx Technology must confirm it).
schema: approx.training/v1
model_id: hike-6.5
display_name: Hike 6.5
kind: language_model
version_series: "1.0"
base_model: Qwen/Qwen2.5-7B-Instruct
base_model_revision: null
base_model_license_note: Qwen2.5-7B-Instruct is published under Apache-2.0 (verify on the model card at training time).
license_blocker: null
architecture_hint: {hidden_size: 3584, intermediate_size: 18944, num_hidden_layers: 28, num_attention_heads: 28,
                    num_key_value_heads: 4, vocab_size: 152064, tie_word_embeddings: false}
system_prompt: >-
  You are Hike 6.5, the advanced reasoning model of Approx AI by Approx Technology. Reason carefully, show the key
  steps, check your answers, and reply in the user's language (English, Urdu, Roman Urdu or a mix). Refuse harmful
  requests and offer a safe alternative.
dataset:
  version_prefix: hike-edu
  domains: all
  max_per_domain: 20000
  ratios: {eval: 0.08, test: 0.08}
  seed: 6565
lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
train: {epochs: 2, learning_rate: 0.00015, lr_scheduler: cosine, warmup_ratio: 0.03, weight_decay: 0.0, max_grad_norm: 0.3,
        gradient_checkpointing: true, checkpoints_per_epoch: 2, max_save_steps: 200, save_total_limit: 3, logging_steps: 1, seed: 6565}
profiles:
  - {name: a100-40gb, min_vram_gb: 38, per_device_batch_size: 4, gradient_accumulation_steps: 4, max_seq_length: 2048}
  - {name: l4-24gb, min_vram_gb: 22, per_device_batch_size: 2, gradient_accumulation_steps: 8, max_seq_length: 2048}
  - {name: t4-16gb, min_vram_gb: 14, per_device_batch_size: 1, gradient_accumulation_steps: 16, max_seq_length: 1024}
hardware:
  min_compute_capability: 7.0
  min_disk_gb: 25
  recommended: "1× NVIDIA L4 24 GB or A100; a T4 16 GB works with sequence length 1024 (slow)"
evaluation: {suite: eval/unseen_suite_v1.jsonl, required_score: 100, safety_required_pass_rate: 1.0, max_new_tokens: 384, regression_tolerance: 0.0}
