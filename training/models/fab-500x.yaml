# FAB 500X — restricted advanced coding model + media orchestration layer. Pipeline prepared; NOT trained.
# This QLoRA adapter is a TEXT/CODE model. It plans storyboards, scenes and shots and orchestrates media pipelines;
# it does NOT generate or understand video by itself. Video generation / understanding are separate pipelines
# (kind video_pipeline / multimodal_model in backend/config/models.json) connected by URL when they exist.
schema: approx.training/v1
model_id: fab-500x
display_name: FAB 500X
kind: code_model
version_series: "1.0"
base_model: Qwen/Qwen2.5-Coder-32B-Instruct
base_model_revision: null
base_model_license_note: Qwen2.5-Coder-32B-Instruct is published under Apache-2.0 (verify on the model card at training time).
license_blocker: null
architecture_hint: {hidden_size: 5120, intermediate_size: 27648, num_hidden_layers: 64, num_attention_heads: 40,
                    num_key_value_heads: 8, vocab_size: 152064, tie_word_embeddings: false}
system_prompt: >-
  You are FAB 500X, the restricted advanced coding and media-planning model of Approx AI by Approx Technology.
  Write correct, secure, well-tested code; for media requests produce precise storyboards, scene and shot plans and
  pipeline instructions, and say clearly that rendering is done by a separate video pipeline. Refuse malware,
  credential theft and other harmful requests and offer a safe, defensive alternative.
dataset:
  version_prefix: fab-code
  domains: [coding, cybersecurity, reasoning, mathematics, media_planning, safety, english, instruction_following, structured_output]
  max_per_domain: 20000
  ratios: {eval: 0.08, test: 0.08}
  seed: 5000
lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
train: {epochs: 2, learning_rate: 0.0001, lr_scheduler: cosine, warmup_ratio: 0.03, weight_decay: 0.0, max_grad_norm: 0.3,
        gradient_checkpointing: true, checkpoints_per_epoch: 2, max_save_steps: 200, save_total_limit: 3, logging_steps: 1, seed: 5000}
profiles:
  - {name: a100-80gb, min_vram_gb: 70, per_device_batch_size: 2, gradient_accumulation_steps: 8, max_seq_length: 4096}
  - {name: a100-40gb, min_vram_gb: 38, per_device_batch_size: 1, gradient_accumulation_steps: 16, max_seq_length: 2048}
hardware:
  min_compute_capability: 8.0
  min_disk_gb: 80
  recommended: "1× NVIDIA A100 80 GB or H100 (NEBIUS); A100 40 GB at sequence length 2048"
evaluation:
  suite: eval/unseen_suite_v1.jsonl
  categories: [coding, reasoning, mathematics, instruction_following, structured_responses, safety, malformed_input, hallucination_resistance, english]
  required_score: 100
  safety_required_pass_rate: 1.0
  max_new_tokens: 512
  regression_tolerance: 0.0
media_architecture:
  pipelines: [video-generation, video-understanding, image-understanding, audio]
  text_tasks: [storyboard, scene_planning, shot_planning, media_orchestration]
  note: "Rendering/understanding run in the connected pipelines; the adapter never claims to have produced a video."
