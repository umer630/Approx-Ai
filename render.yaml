# Approx AI — free deployment Blueprint for Render (https://render.com).
# Free: no credit card, auto HTTPS URL like https://approx-ai.onrender.com, no custom domain needed.
#
# One-time setup (the only step that needs YOU — a free account authorization):
#   1. Push this repo to your GitHub (already there).
#   2. On render.com → New → Blueprint → connect your GitHub → pick this repo → Apply.
#   3. Render builds the Docker image and gives you a public HTTPS URL.
#
# Honest notes:
#   * Free web services sleep after ~15 min idle; the next request cold-starts in ~30-60s. This is a real,
#     operational server (just slow on the first hit), not a fake one.
#   * The free disk is ephemeral: the SQLite database at /data resets on each redeploy/restart. Fine for
#     testing and demos. For durable accounts, attach a paid disk or point APPROX at a managed Postgres later.
#   * Real AI model responses need a GPU inference endpoint (not free-continuous). Until you connect one
#     (APPROX_MODEL_*_URL), chat returns an honest "model backend unavailable" — it never fakes answers.
services:
  - type: web
    name: approx-ai
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APPROX_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: APPROX_TRUST_PROXY
        value: "1"
      # Render injects the external URL as RENDER_EXTERNAL_URL; the server reads it (see config.js).
      - key: APPROX_PUBLIC_URL
        sync: false   # optional: set to your https://<name>.onrender.com after first deploy
      # Email verification stays ON. Verification codes are sent through a free mail provider:
      # MAIL_TRANSPORT=brevo + MAIL_HTTP_API_KEY (Brevo free plan, single verified sender — no domain needed).
      - key: REQUIRE_VERIFIED_EMAIL
        value: "true"
      - key: MAIL_TRANSPORT
        value: brevo
      - key: MAIL_HTTP_API_KEY
        sync: false   # secret: entered in the Render dashboard, never committed
      - key: MAIL_FROM
        sync: false   # e.g. Approx AI <the-address-you-verified-in-brevo@example.com>
      - key: APPROX_BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false   # optional: your email; promoted to superadmin once, after you verify it
      # CORS: empty = same-origin only (correct & secure for this deploy — the web app is same-origin and the APK
      # uses bearer tokens, so no cross-origin CORS is needed). Add origins here only if a different web origin
      # must call the API, e.g. APPROX_CORS_ORIGINS=https://example.com
      - key: APPROX_CORS_ORIGINS
        sync: false
      # Model inference endpoints — leave unset until you have a GPU host (real Nick 4.8) or an OpenAI-compatible
      # LLM API (a general assistant, clearly NOT the trained Nick). Set per family, e.g.:
      #   APPROX_MODEL_NICK_URL  = https://<your-gpu-host>/v1     (leave _NAME unset -> serves nick-4.8@<version>)
      #   APPROX_MODEL_NICK_KEY  = <the inference server's INFERENCE_API_KEY>
      - key: APPROX_MODEL_NICK_URL
        sync: false
      - key: APPROX_MODEL_NICK_KEY
        sync: false
      - key: APPROX_INFERENCE_ADMIN_URL
        sync: false
      - key: APPROX_INFERENCE_ADMIN_KEY
        sync: false
