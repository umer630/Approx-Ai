<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Approx AI by Approx Technology — fast, private, multilingual AI assistant.">
  <title>Approx AI</title>
  <link rel="icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/fab500x.css">
</head>
<body>
  <!-- Splash: plain HTML/CSS so it paints before any JavaScript runs (no blank screen). Removed by app.js. -->
  <div id="splash" role="status" aria-label="Approx AI is starting">
    <img src="/assets/logo-mark-192.png" alt="Approx AI" width="88" height="88">
    <div class="splash-name">Approx <span>AI</span></div>
    <div class="splash-by">by Approx Technology</div>
  </div>
  <div id="app" aria-live="polite"></div>
  <noscript>Approx AI requires JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
